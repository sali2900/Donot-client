name: Build Mod Jar

on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle CLI
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: Build Jar
        run: |
          TARGET_DIR=$(find . -name "build.gradle" -not -path "*/.*" -exec dirname {} \; | head -n 1)
          if [ -n "$TARGET_DIR" ]; then
            cd "$TARGET_DIR"
            gradle build --no-daemon
          else
            echo "Error: build.gradle not found in repository!"
            exit 1
          fi

      - name: Upload Mod Jar Artifact
        uses: actions/upload-artifact@v4
        with:
          name: donot-client-1.21.1-jar
          path: '**/build/libs/*.jar'
